backend:
  name: github
  repo: fabian202/fun-corcolombia
  branch: main
  base_url: https://cortejiendosuenos.org
  auth_endpoint: api/auth

# Solo para editar en local:
# 1. Descomenta local_backend
# 2. Corre npm run cms
# local_backend: true

media_folder: public/gallery/uploads
public_folder: /gallery/uploads

locale: es

site_url: https://cortejiendosuenos.org
display_url: https://cortejiendosuenos.org

collections:
  - name: gallery
    label: Galería
    label_singular: Álbum
    folder: src/content/gallery
    create: true
    slug: '{{slug}}'
    extension: json
    format: json
    summary: '{{date}} · {{album}}'
    sortable_fields: [order, date, album]
    fields:
      - label: Título del álbum
        name: album
        widget: string
        hint: 'Ej: Barrio Alfonso López'
      - label: Fecha o lugar
        name: date
        widget: string
        hint: 'Ej: 27 abril 2024 · Medellín'
      - label: Orden
        name: order
        widget: number
        default: 0
        value_type: int
        hint: Menor número aparece primero en la galería
      - label: Fotos
        name: pics
        widget: list
        label_singular: Foto
        summary: '{{fields.pic}}'
        field:
          label: Imagen
          name: pic
          widget: image
          choose_url: false
